seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/biokg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/models_biokg/run1/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
clean_train_set = true
make_directed = true
remove_duplicate_triplets = true
make_directed_edges = []
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true

[preprocessing.params]
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8
theta = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
filter_count = 3
dissimilarity = "L2"
name = "RESCAL"
margin = 1

[model.encoder]
gnn_layer_number = 1
name = "GCN"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
evaluation_batch_size = 256
pretrained_embeddings = "auto"
patience = 5
evaluation_interval = 10
save_interval = 2
train_batch_size = 4096
max_epochs = 250

[evaluation]
objective = "Link Prediction"
made_directed_edges = [
    "DDI",
    "PPI",
    "DDI_inv",
    "PPI_inv",
    "DPI",
    "DRUG_TARGET",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv"
target_edges = [
    "DRUG_DISEASE_ASSOCIATION",
]
thresholds = [
    10,
    5,
]

[data_leakage]
permuted_edges = []
