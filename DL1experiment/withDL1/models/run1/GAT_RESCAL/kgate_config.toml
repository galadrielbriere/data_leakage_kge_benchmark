seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/models/run1/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
split = [
    0.8,
    0.1,
    0.1,
]
make_directed_edges = []
remove_duplicate_triplets = true
flag_near_duplicate_edges = true
make_directed = true
clean_train_set = true

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.decoder]
filter_count = 3
dissimilarity = "L2"
name = "RESCAL"
margin = 1

[model.encoder]
name = "GAT"
gnn_layer_number = 1

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
train_batch_size = 4096
max_epochs = 250
patience = 5
save_interval = 2
pretrained_embeddings = "auto"
evaluation_interval = 10
evaluation_batch_size = 256

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
thresholds = [
    10,
    5,
]
target_edges = [
    "indication",
]
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]

[data_leakage]
permuted_edges = []
