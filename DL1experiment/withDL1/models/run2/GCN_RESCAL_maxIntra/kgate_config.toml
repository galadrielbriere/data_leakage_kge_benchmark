seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withDL1/models/run2/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed = true
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true
make_directed_edges = []
clean_train_set = true
remove_duplicate_triplets = true

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.encoder]
gnn_layer_number = 1
neighbor_aggregation = "max"
name = "GCN"

[model.decoder]
filter_count = 3
dissimilarity = "L2"
margin = 1
name = "RESCAL"

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_0 = 10
T_mult = 2

[training]
evaluation_batch_size = 256
patience = 5
max_epochs = 250
save_interval = 2
pretrained_embeddings = "auto"
evaluation_interval = 10
train_batch_size = 4096

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
thresholds = [
    10,
    5,
]
target_edges = [
    "indication",
]
objective = "Link Prediction"

[data_leakage]
permuted_edges = []
