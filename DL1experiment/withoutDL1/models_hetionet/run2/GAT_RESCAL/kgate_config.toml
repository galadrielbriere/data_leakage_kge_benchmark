seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/hetionet_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/models_hetionet/run2/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
split = [
    0.8,
    0.1,
    0.1,
]
make_directed = true
make_directed_edges = []
clean_train_set = true
flag_near_duplicate_edges = true
remove_duplicate_triplets = true

[preprocessing.params]
theta_second_edge_type = 0.8
theta = 0.8
theta_first_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
gnn_layer_number = 1
name = "GAT"

[model.decoder]
filter_count = 3
margin = 1
dissimilarity = "L2"
name = "RESCAL"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
patience = 5
max_epochs = 250
save_interval = 2
pretrained_embeddings = "auto"
evaluation_interval = 10
train_batch_size = 4096
evaluation_batch_size = 256

[evaluation]
target_edges = [
    "CtD",
]
objective = "Link Prediction"
made_directed_edges = [
    "DrD",
    "DrD_inv",
    "CrC",
    "CrC_inv",
    "GiG",
    "GiG_inv",
    "GcG",
    "GcG_inv",
]
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/hetionet_orphan_associations_only.tsv"

[data_leakage]
permuted_edges = []
