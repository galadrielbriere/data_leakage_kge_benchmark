seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/models/run1/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true
remove_duplicate_triplets = true
make_directed = true
clean_train_set = true
make_directed_edges = []

[preprocessing.params]
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8
theta = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
name = "GAT"
gnn_layer_number = 1

[model.decoder]
name = "RESCAL"
margin = 1
filter_count = 3
dissimilarity = "L2"

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
evaluation_batch_size = 516
max_epochs = 500
train_batch_size = 4096
patience = 10
evaluation_interval = 20
save_interval = 5
pretrained_embeddings = "auto"

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
thresholds = [
    10,
    5,
]
target_edges = [
    "indication",
]

[data_leakage]
permuted_edges = []
