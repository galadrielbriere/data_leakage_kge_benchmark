seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/models/run1/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed_edges = []
clean_train_set = true
make_directed = true
remove_duplicate_triplets = true
flag_near_duplicate_edges = true
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
gnn_layer_number = 1
name = "GCN"
neighbor_aggregation = "max"

[model.decoder]
margin = 1
name = "RESCAL"
filter_count = 3
dissimilarity = "L2"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
evaluation_batch_size = 256
max_epochs = 250
patience = 5
save_interval = 2
train_batch_size = 4096
pretrained_embeddings = "auto"
evaluation_interval = 10

[evaluation]
target_edges = [
    "indication",
]
objective = "Link Prediction"
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]

[data_leakage]
permuted_edges = []
