common:
  seed: 42
  input_pkl: '/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/kg_processing/kg.pkl'
  out: './'
  verbose: true
  run_kg_prep: false
  run_training: true
  run_evaluation: true
  plot_training_metrics: true
  run_inference: '/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv'

model:
  name: "TransH"               
  emb_dim: 200
  margin: 1                  

sampler:
  name: 'Mixed'
  n_neg: 5

optimizer:
  name: "Adam"
  params:
    lr: 0.001
    weight_decay: 0.001                        

lr_scheduler:  # Learning rate scheduler
  type: "CosineAnnealingWarmRestarts"  # Scheduler type (any from Pytorch)
  params:
    T_0: 10  # First cycle length
    T_mult: 2  # Multiplicative factor for cycle length

training:
  max_epochs: 500              
  batch_size: 4096     
  eval_interval: 20
  eval_batch_size: 64
  patience: 10

evaluation:
  made_directed_relations: ["drug_drug", "disease_disease", "protein_protein", "drug_drug_inv", "disease_disease_inv", "protein_protein_inv"]
  target_relations: ["indication", "indication"]
  thresholds: [10, 5]
