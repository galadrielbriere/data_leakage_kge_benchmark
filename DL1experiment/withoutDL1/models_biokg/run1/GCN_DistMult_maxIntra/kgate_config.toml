seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/biokg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/models_biokg/run1/GCN_DistMult_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
remove_duplicate_triplets = true
make_directed = true
make_directed_edges = []
clean_train_set = true
flag_near_duplicate_edges = true
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
neighbor_aggregation = "max"
name = "GCN"
gnn_layer_number = 1

[model.decoder]
filter_count = 3
margin = 1
name = "DistMult"
dissimilarity = "L2"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
train_batch_size = 4096
pretrained_embeddings = "auto"
evaluation_batch_size = 256
max_epochs = 250
patience = 5
evaluation_interval = 10
save_interval = 2

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv"
made_directed_edges = [
    "DDI",
    "PPI",
    "DDI_inv",
    "PPI_inv",
    "DPI",
    "DRUG_TARGET",
]
target_edges = [
    "DRUG_DISEASE_ASSOCIATION",
]
thresholds = [
    10,
    5,
]
objective = "Link Prediction"

[data_leakage]
permuted_edges = []
