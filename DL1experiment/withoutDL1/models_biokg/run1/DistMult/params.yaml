common:
  seed: 42
  input_pkl: '/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL1experiment/withoutDL1/biokg_processing'
  out: './'
  run_kg_prep: false
  run_training: true
  run_evaluation: true
  plot_training_metrics: true
  run_inference: '/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv'

model:
  name: "DistMult"               
  emb_dim: 200
  margin: 1                  

sampler:
  name: 'Mixed'
  n_neg: 5

optimizer:
  name: "Adam"
  params:
    lr: 0.001
    weight_decay: 0.001                        

training:
  max_epochs: 500              
  batch_size: 4096     
  eval_interval: 20
  eval_batch_size: 64
  patience: 10

evaluation:
  made_directed_relations: ['DDI', 'PPI', 'DDI_inv', 'PPI_inv', 'DPI', 'DRUG_TARGET']
  target_relations: ['DRUG_DISEASE_ASSOCIATION']
  thresholds: [10, 5]

