common:
  seed: 42
  input_csv: "knowledge_graph/TarKG_without_orpha_indication.tsv"
  out: "DL1experiment/withoutDL1/tarKG_processing/"
  run_kg_prep: true
  run_training: false
  run_evaluation: false

clean_kg:   
  remove_duplicates_triplets: true 

  make_directed: true
  make_directed_params: 
    - "Compound associated with Compound"
    - "Compound compare Compound"
    - "Compound ddi Compound"
    - "Compound negative correlate Compound"
    - "Compound positive correlate Compound"
    - "Compound resembles Compound"
    - "Compound synergistic interaction Compound"
    - "Disease associated with Disease"
    - "Disease resembles Disease"
    - "Gene associated with Gene"
    - "Gene binds Gene"
    - "Gene colocalization Gene"
    - "Gene covaries Gene"
    - "Gene host microbiome interaction Gene"
    - "Gene negative correlate Gene"
    - "Gene other Gene"
    - "Gene physical association Gene"
    - "Gene positive correlate Gene"
    - "Gene ppi Gene"
    - "Gene relationships involving regulation and pathways Gene"
    - "Gene same protein or complex Gene"
    - "Gene signaling pathway Gene"

  check_DL1: true 
  check_DL1_params:
    theta1: 0.8
    theta2: 0.8
    theta: 0.8

  permute_kg: false

  clean_train_set: true

  cold_start_split: false
