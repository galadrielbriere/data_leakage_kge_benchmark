seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/hetionet_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/models_hetionet/run2/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
clean_train_set = true
remove_duplicate_triplets = true
make_directed = true
split = [
    0.8,
    0.1,
    0.1,
]
make_directed_edges = []
flag_near_duplicate_edges = true

[preprocessing.params]
theta_first_edge_type = 0.8
theta = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
name = "GCN"
gnn_layer_number = 1

[model.decoder]
filter_count = 3
name = "RESCAL"
margin = 1
dissimilarity = "L2"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_0 = 10
T_mult = 2

[training]
pretrained_embeddings = "auto"
train_batch_size = 4096
save_interval = 5
evaluation_batch_size = 256
patience = 5
max_epochs = 250
evaluation_interval = 10

[evaluation]
target_edges = [
    "CtD",
]
made_directed_edges = [
    "DrD",
    "DrD_inv",
    "CrC",
    "CrC_inv",
    "GiG",
    "GiG_inv",
    "GcG",
    "GcG_inv",
]
thresholds = [
    10,
    5,
]
objective = "Link Prediction"
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/hetionet_orphan_associations_only.tsv"

[data_leakage]
permuted_edges = []
