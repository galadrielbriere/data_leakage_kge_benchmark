seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/hetionet_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/models_hetionet/run1/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
flag_near_duplicate_edges = true
make_directed = true
remove_duplicate_triplets = true
clean_train_set = true
make_directed_edges = []
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8
theta = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
margin = 1
dissimilarity = "L2"
filter_count = 3
name = "RESCAL"

[model.encoder]
gnn_layer_number = 1
neighbor_aggregation = "max"
name = "GCN"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
pretrained_embeddings = "auto"
evaluation_batch_size = 256
save_interval = 5
evaluation_interval = 10
train_batch_size = 4096
max_epochs = 250
patience = 5

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/hetionet_orphan_associations_only.tsv"
target_edges = [
    "CtD",
]
objective = "Link Prediction"
made_directed_edges = [
    "DrD",
    "DrD_inv",
    "CrC",
    "CrC_inv",
    "GiG",
    "GiG_inv",
    "GcG",
    "GcG_inv",
]
thresholds = [
    10,
    5,
]

[data_leakage]
permuted_edges = []
