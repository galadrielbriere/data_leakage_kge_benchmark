seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/models/run2/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed_edges = []
flag_near_duplicate_edges = true
make_directed = true
clean_train_set = true
remove_duplicate_triplets = true
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
margin = 1
dissimilarity = "L2"
name = "RESCAL"
filter_count = 3

[model.encoder]
gnn_layer_number = 1
name = "GAT"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_0 = 10
T_mult = 2

[training]
evaluation_batch_size = 516
patience = 10
max_epochs = 500
evaluation_interval = 20
train_batch_size = 4096
pretrained_embeddings = "auto"
save_interval = 5

[evaluation]
thresholds = [
    10,
    5,
]
objective = "Link Prediction"
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
target_edges = [
    "indication",
]

[data_leakage]
permuted_edges = []
