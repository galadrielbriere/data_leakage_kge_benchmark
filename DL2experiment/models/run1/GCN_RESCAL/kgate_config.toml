seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/models/run1/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
flag_near_duplicate_edges = true
remove_duplicate_triplets = true
make_directed_edges = []
make_directed = true
clean_train_set = true
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta = 0.8
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.encoder]
name = "GCN"
gnn_layer_number = 1

[model.decoder]
dissimilarity = "L2"
name = "RESCAL"
margin = 1
filter_count = 3

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
evaluation_interval = 10
evaluation_batch_size = 256
patience = 5
save_interval = 5
pretrained_embeddings = "auto"
max_epochs = 250
train_batch_size = 4096

[evaluation]
target_edges = [
    "indication",
]
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]

[data_leakage]
permuted_edges = []
