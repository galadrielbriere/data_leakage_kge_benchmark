seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/kg_processing/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL2experiment/models/run1/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
flag_near_duplicate_edges = true
remove_duplicate_triplets = true
clean_train_set = true
split = [
    0.8,
    0.1,
    0.1,
]
make_directed_edges = []
make_directed = true

[preprocessing.params]
theta_second_edge_type = 0.8
theta = 0.8
theta_first_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
name = "GCN"
gnn_layer_number = 1
neighbor_aggregation = "max"

[model.decoder]
dissimilarity = "L2"
filter_count = 3
name = "RESCAL"
margin = 1

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
patience = 5
pretrained_embeddings = "auto"
evaluation_interval = 10
evaluation_batch_size = 256
max_epochs = 250
save_interval = 5
train_batch_size = 4096

[evaluation]
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
target_edges = [
    "indication",
]
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"

[data_leakage]
permuted_edges = []
