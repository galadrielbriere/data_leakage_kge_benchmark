seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/biokg_processing_disease/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_diseases_biokg/run1/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
split = [
    0.8,
    0.1,
    0.1,
]
clean_train_set = true
make_directed = true
make_directed_edges = []
remove_duplicate_triplets = true
flag_near_duplicate_edges = true

[preprocessing.params]
theta = 0.8
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.decoder]
dissimilarity = "L2"
name = "RESCAL"
filter_count = 3
margin = 1

[model.encoder]
name = "GAT"
gnn_layer_number = 1

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
max_epochs = 250
pretrained_embeddings = "auto"
save_interval = 5
evaluation_batch_size = 256
patience = 5
evaluation_interval = 10
train_batch_size = 4096

[evaluation]
objective = "Link Prediction"
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv"
thresholds = [
    10,
    5,
]
target_edges = [
    "DRUG_DISEASE_ASSOCIATION",
]
made_directed_edges = [
    "DDI",
    "PPI",
    "DDI_inv",
    "PPI_inv",
    "DPI",
    "DRUG_TARGET",
]

[data_leakage]
permuted_edges = []
