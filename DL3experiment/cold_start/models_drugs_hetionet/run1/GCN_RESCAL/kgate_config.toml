seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/hetionet_processing_drug/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs_hetionet/run1/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
flag_near_duplicate_edges = true
split = [
    0.8,
    0.1,
    0.1,
]
make_directed = true
remove_duplicate_triplets = true
clean_train_set = true
make_directed_edges = []

[preprocessing.params]
theta = 0.8
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.encoder]
gnn_layer_number = 1
name = "GCN"

[model.decoder]
filter_count = 3
dissimilarity = "L2"
name = "RESCAL"
margin = 1

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
train_batch_size = 4096
patience = 5
evaluation_batch_size = 256
save_interval = 5
pretrained_embeddings = "auto"
max_epochs = 250
evaluation_interval = 10

[evaluation]
target_edges = [
    "CtD",
]
made_directed_edges = [
    "DrD",
    "DrD_inv",
    "CrC",
    "CrC_inv",
    "GiG",
    "GiG_inv",
    "GcG",
    "GcG_inv",
]
thresholds = [
    10,
    5,
]
objective = "Link Prediction"
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/hetionet_orphan_associations_only.tsv"

[data_leakage]
permuted_edges = []
