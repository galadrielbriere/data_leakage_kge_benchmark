seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/hetionet_processing_disease/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_diseases_hetionet/run2/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
split = [
    0.8,
    0.1,
    0.1,
]
clean_train_set = true
make_directed = true
remove_duplicate_triplets = true
flag_near_duplicate_edges = true
make_directed_edges = []

[preprocessing.params]
theta = 0.8
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
margin = 1
name = "RESCAL"
filter_count = 3
dissimilarity = "L2"

[model.encoder]
name = "GAT"
gnn_layer_number = 1

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
max_epochs = 250
pretrained_embeddings = "auto"
train_batch_size = 4096
evaluation_batch_size = 256
evaluation_interval = 10
save_interval = 5
patience = 5

[evaluation]
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/hetionet_orphan_associations_only.tsv"
made_directed_edges = [
    "DrD",
    "DrD_inv",
    "CrC",
    "CrC_inv",
    "GiG",
    "GiG_inv",
    "GcG",
    "GcG_inv",
]
objective = "Link Prediction"
target_edges = [
    "CtD",
]

[data_leakage]
permuted_edges = []
