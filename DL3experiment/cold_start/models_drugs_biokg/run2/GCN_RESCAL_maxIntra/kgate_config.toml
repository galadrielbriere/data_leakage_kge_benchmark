seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/biokg_processing_drug/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs_biokg/run2/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
remove_duplicate_triplets = true
flag_near_duplicate_edges = true
make_directed = true
clean_train_set = true
make_directed_edges = []
split = [
    0.8,
    0.1,
    0.1,
]

[preprocessing.params]
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8
theta = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
margin = 1
name = "RESCAL"
dissimilarity = "L2"
filter_count = 3

[model.encoder]
neighbor_aggregation = "max"
name = "GCN"
gnn_layer_number = 1

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
pretrained_embeddings = "auto"
train_batch_size = 4096
evaluation_interval = 10
save_interval = 5
patience = 5
evaluation_batch_size = 256
max_epochs = 250

[evaluation]
thresholds = [
    10,
    5,
]
objective = "Link Prediction"
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv"
made_directed_edges = [
    "DDI",
    "PPI",
    "DDI_inv",
    "PPI_inv",
    "DPI",
    "DRUG_TARGET",
]
target_edges = [
    "DRUG_DISEASE_ASSOCIATION",
]

[data_leakage]
permuted_edges = []
