seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/biokg_processing_drug/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs_biokg/run1/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
remove_duplicate_triplets = true
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true
make_directed = true
make_directed_edges = []
clean_train_set = true

[preprocessing.params]
theta_second_edge_type = 0.8
theta = 0.8
theta_first_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.encoder]
name = "GCN"
neighbor_aggregation = "max"
gnn_layer_number = 1

[model.decoder]
name = "RESCAL"
filter_count = 3
margin = 1
dissimilarity = "L2"

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
save_interval = 5
train_batch_size = 4096
pretrained_embeddings = "auto"
patience = 5
evaluation_batch_size = 256
max_epochs = 250
evaluation_interval = 10

[evaluation]
made_directed_edges = [
    "DDI",
    "PPI",
    "DDI_inv",
    "PPI_inv",
    "DPI",
    "DRUG_TARGET",
]
thresholds = [
    10,
    5,
]
target_edges = [
    "DRUG_DISEASE_ASSOCIATION",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/biokg_orphan_associations_only.tsv"
objective = "Link Prediction"

[data_leakage]
permuted_edges = []
