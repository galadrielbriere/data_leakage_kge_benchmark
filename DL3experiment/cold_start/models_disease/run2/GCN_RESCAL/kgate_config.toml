seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_disease/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_disease/run2/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
clean_train_set = true
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true
make_directed = true
remove_duplicate_triplets = true
make_directed_edges = []

[preprocessing.params]
theta_second_edge_type = 0.8
theta = 0.8
theta_first_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.encoder]
gnn_layer_number = 1
name = "GCN"

[model.decoder]
filter_count = 3
dissimilarity = "L2"
margin = 1
name = "RESCAL"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
max_epochs = 250
evaluation_interval = 10
evaluation_batch_size = 256
train_batch_size = 4096
save_interval = 5
patience = 5
pretrained_embeddings = "auto"

[evaluation]
target_edges = [
    "indication",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
thresholds = [
    10,
    5,
]

[data_leakage]
permuted_edges = []
