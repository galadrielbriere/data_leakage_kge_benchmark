seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_disease/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_disease/run2/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
flag_near_duplicate_edges = true
remove_duplicate_triplets = true
make_directed = true
split = [
    0.8,
    0.1,
    0.1,
]
make_directed_edges = []
clean_train_set = true

[preprocessing.params]
theta_first_edge_type = 0.8
theta_second_edge_type = 0.8
theta = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
dissimilarity = "L2"
filter_count = 3
margin = 1
name = "RESCAL"

[model.encoder]
neighbor_aggregation = "max"
gnn_layer_number = 1
name = "GCN"

[sampler]
negative_triplet_count = 5
name = "Mixed"

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
evaluation_interval = 10
max_epochs = 250
patience = 5
save_interval = 5
pretrained_embeddings = "auto"
train_batch_size = 4096
evaluation_batch_size = 256

[evaluation]
target_edges = [
    "indication",
]
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"
thresholds = [
    10,
    5,
]

[data_leakage]
permuted_edges = []
