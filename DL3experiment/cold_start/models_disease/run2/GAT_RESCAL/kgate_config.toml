seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_disease/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_disease/run2/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
clean_train_set = true
make_directed = true
split = [
    0.8,
    0.1,
    0.1,
]
make_directed_edges = []
flag_near_duplicate_edges = true
remove_duplicate_triplets = true

[preprocessing.params]
theta_second_edge_type = 0.8
theta_first_edge_type = 0.8
theta = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
name = "RESCAL"
filter_count = 3
dissimilarity = "L2"
margin = 1

[model.encoder]
name = "GAT"
gnn_layer_number = 1

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
train_batch_size = 4096
evaluation_batch_size = 516
max_epochs = 500
save_interval = 5
patience = 10
evaluation_interval = 20
pretrained_embeddings = "auto"

[evaluation]
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
thresholds = [
    10,
    5,
]
target_edges = [
    "indication",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"

[data_leakage]
permuted_edges = []
