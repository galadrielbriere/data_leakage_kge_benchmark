seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_drugs/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs/run1/GCN_RESCAL_maxIntra/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed_edges = []
flag_near_duplicate_edges = true
remove_duplicate_triplets = true
make_directed = true
split = [
    0.8,
    0.1,
    0.1,
]
clean_train_set = true

[preprocessing.params]
theta_first_edge_type = 0.8
theta = 0.8
theta_second_edge_type = 0.8

[model]
node_embedding_dimensions = 200
edge_embedding_dimensions = -1

[model.decoder]
margin = 1
filter_count = 3
name = "RESCAL"
dissimilarity = "L2"

[model.encoder]
neighbor_aggregation = "max"
name = "GCN"
gnn_layer_number = 1

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
pretrained_embeddings = "auto"
evaluation_batch_size = 256
save_interval = 5
train_batch_size = 4096
evaluation_interval = 10
patience = 5
max_epochs = 250

[evaluation]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
objective = "Link Prediction"
thresholds = [
    10,
    5,
]
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
target_edges = [
    "indication",
]

[data_leakage]
permuted_edges = []
