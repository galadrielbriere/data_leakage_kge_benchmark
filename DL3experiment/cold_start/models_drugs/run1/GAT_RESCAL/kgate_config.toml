seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_drugs/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs/run1/GAT_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed_edges = []
clean_train_set = true
split = [
    0.8,
    0.1,
    0.1,
]
flag_near_duplicate_edges = true
make_directed = true
remove_duplicate_triplets = true

[preprocessing.params]
theta_first_edge_type = 0.8
theta = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.decoder]
filter_count = 3
dissimilarity = "L2"
margin = 1
name = "RESCAL"

[model.encoder]
gnn_layer_number = 1
name = "GAT"

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
weight_decay = 0.001
lr = 0.001

[learning_rate_scheduler]
type = ""

[learning_rate_scheduler.params]

[training]
patience = 5
max_epochs = 250
evaluation_batch_size = 256
save_interval = 5
evaluation_interval = 10
train_batch_size = 4096
pretrained_embeddings = "auto"

[evaluation]
objective = "Link Prediction"
target_edges = [
    "indication",
]
thresholds = [
    10,
    5,
]
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"

[data_leakage]
permuted_edges = []
