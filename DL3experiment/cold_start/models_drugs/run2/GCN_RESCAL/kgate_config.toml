seed = 42
kg_csv = ""
kg_pkl = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/kg_processing_drugs/kgate/"
metadata_csv = ""
output_directory = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/DL3experiment/cold_start/models_drugs/run2/GCN_RESCAL/"
verbose = true
run_kg_preprocessing = false

[preprocessing]
make_directed = true
make_directed_edges = []
clean_train_set = true
flag_near_duplicate_edges = true
split = [
    0.8,
    0.1,
    0.1,
]
remove_duplicate_triplets = true

[preprocessing.params]
theta_first_edge_type = 0.8
theta = 0.8
theta_second_edge_type = 0.8

[model]
edge_embedding_dimensions = -1
node_embedding_dimensions = 200

[model.decoder]
dissimilarity = "L2"
margin = 1
name = "RESCAL"
filter_count = 3

[model.encoder]
gnn_layer_number = 1
name = "GCN"

[sampler]
name = "Mixed"
negative_triplet_count = 5

[optimizer]
name = "Adam"

[optimizer.params]
lr = 0.001
weight_decay = 0.001

[learning_rate_scheduler]
type = "CosineAnnealingWarmRestarts"

[learning_rate_scheduler.params]
T_mult = 2
T_0 = 10

[training]
evaluation_interval = 10
save_interval = 5
evaluation_batch_size = 256
max_epochs = 250
pretrained_embeddings = "auto"
patience = 5
train_batch_size = 4096

[evaluation]
objective = "Link Prediction"
made_directed_edges = [
    "drug_drug",
    "disease_disease",
    "protein_protein",
    "drug_drug_inv",
    "disease_disease_inv",
    "protein_protein_inv",
]
thresholds = [
    10,
    5,
]
inference_kg = "/lustre/fswork/projects/rech/rnk/ufq76hz/dr_benchmark/knowledge_graph/orphan_associations.tsv"
target_edges = [
    "indication",
]

[data_leakage]
permuted_edges = []
